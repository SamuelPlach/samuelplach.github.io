<dialog id="image-viewer" aria-labelledby="image-viewer-caption">
  <div class="viewer-toolbar">
    <button type="button" class="viewer-previous" aria-label="Previous image">←</button>
    <span class="viewer-count" aria-live="polite"></span>
    <button type="button" class="viewer-next" aria-label="Next image">→</button>
    <button type="button" class="viewer-close" aria-label="Close enlarged image">Close ×</button>
  </div>
  <p class="viewer-paper-title" hidden></p>
  <div class="viewer-stage"><img alt=""></div>
  <p id="image-viewer-caption"></p>
  <div class="viewer-notes" hidden></div>
  <a class="viewer-original" target="_blank" rel="noopener noreferrer">Open original image ↗</a>
</dialog>
<script src="site.js"></script>
